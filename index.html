<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Mensetsu - Ruangan Wawancara 3D Interaktif</title>

    <!-- A-Frame WebXR Engine Library -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Stylesheet UI & HUD -->
    <link rel="stylesheet" href="css/style.css?v=7.6">

    <!-- Modul JavaScript & Logika Interaksi -->
    <script src="js/audio.js"></script>
    <script src="js/collision.js?v=2.0"></script>
    <script src="js/interaction.js?v=6.0"></script>
    <script src="js/components/voice-recorder.js?v=1.9"></script>
    <script src="js/components/mobile-controls.js?v=4.0"></script>
    <script src="js/components/gate-screen.js?v=4.5"></script>
    <script src="js/components/manner-evaluator.js?v=1.2"></script>
    <script src="js/components/video-player.js?v=2.3"></script>
    <script src="js/components/npc-interviewers.js?v=6.4"></script>
    <script src="js/components/npc-receptionist.js?v=1.9"></script>
    <script src="js/components/dracaena.js"></script>
    <script src="js/components/books.js"></script>
    <script src="js/components/japanese-signs.js?v=2.3"></script>
    <script src="js/components/player.js?v=4.5"></script>
    <script src="js/components/mirror.js?v=8.3"></script>
    <script src="js/scene-loader.js?v=2.6"></script>
</head>
<body>

    <!-- Titik Reticle Tengah -->
    <div class="reticle-dot"></div>

    <!-- 3D VR Scene -->
    <a-scene background="color: #080c16" renderer="antialias: true; colorManagement: true; precision: highp; powerPreference: high-performance;" vr-mode-ui="enabled: false" keyboard-shortcuts="enterVR: false">

        <!-- ASSETS & MATERIAL REUSABLE -->
        <a-assets>
            <a-mixin id="wood-dark" material="color: #241711; roughness: 0.5; metalness: 0.05;"></a-mixin>
            <a-mixin id="wood-trim" material="color: #3b271d; roughness: 0.45;"></a-mixin>
            <a-mixin id="wood-desk" material="color: #382417; roughness: 0.4; metalness: 0.08;"></a-mixin>
            <a-mixin id="wall-mat" material="color: #f8fafc; roughness: 0.9;"></a-mixin>
            <a-mixin id="ceiling-mat" material="color: #ffffff; roughness: 0.95;"></a-mixin>
            <a-mixin id="chair-cushion" material="color: #1e293b; roughness: 0.8;"></a-mixin>
            <a-mixin id="metal-chrome" material="color: #e2e8f0; metalness: 0.85; roughness: 0.2;"></a-mixin>
            <img id="tex-japan-map" src="assets/japan-map.png">
            <img id="tex-fuji-art" src="assets/fuji-art.jpg">
            <img id="tex-candidate-avatar" src="assets/candidate-avatar.png">
            <img id="tex-candidate-head" src="assets/candidate-head.png">
            <img id="tex-candidate-head-clean" src="assets/candidate-head-clean.png">
            <img id="tex-candidate-body" src="assets/candidate-body.png">
            <img id="tex-reception-screen" src="assets/reception-screen.jpg">
            <img id="tex-reception-keyboard" src="assets/reception-keyboard.png">
            <img id="tex-reception-mousepad" src="assets/reception-mousepad.png">
        </a-assets>

        <!-- ========================================================= -->
        <!-- KAMERA PEMAIN (SPAWN AWAL DI RUANG TUNGGU: Z = 14.2)      -->
        <!-- ========================================================= -->
        <a-camera id="player-camera" 
                  position="0 1.6 14.2" 
                  rotation="0 180 0"
                  near="0.05"
                  look-controls="magicWindowTrackingEnabled: false; touchEnabled: false; mouseEnabled: true;" 
                  wasd-controls="acceleration: 26"
                  player-collision-and-proximity>
        </a-camera>

        <!-- ========================================================= -->
        <!-- MODUL SCENE 3D (DIMUAT SECARA ASINKRON DARI FOLDER scenes/) -->
        <!-- ========================================================= -->
        <!-- 1. KONTEN RUANG WAWANCARA (scenes/interview-room.html) -->
        <a-entity id="scene-interview-room"></a-entity>

        <!-- 2. KONTEN RUANG TUNGGU & RESEPSIONIS (scenes/waiting-room.html) -->
        <a-entity id="scene-waiting-room"></a-entity>

    </a-scene>

</body>
</html>
